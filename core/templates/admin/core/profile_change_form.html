{% extends "admin/core/translate_change_form.html" %}
{% load i18n static admin_urls %}

{% block after_field_sets %}
{{ block.super }}
<div class="ai-autogenerate-wrapper">
    <button type="button" id="ai-autogenerate-btn" class="ai-autogenerate-btn">{% translate "Auto-generate" %}</button>
</div>
{% endblock %}

{% block admin_change_form_document_ready %}
{{ block.super }}
<script src="{% static 'core/js/ai_autogenerate.js' %}"></script>
<script>
    window.aiAutoGenerateInit({
        generateUrl: "{% url opts|admin_urlname:'auto_generate_summary' %}"
    });
</script>
{% endblock %}
